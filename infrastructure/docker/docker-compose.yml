services:
  postgres:
    image: postgres:16-alpine
    container_name: gum-postgres
    environment:
      POSTGRES_USER: gum
      POSTGRES_PASSWORD: gum
      POSTGRES_DB: gum
    ports:
      - "5432:5432"
    volumes:
      - gum_pgdata:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gum -d gum"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gum_pgdata:
